# Configuration for automatically generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - github-actions

  categories:
    - title: 🚀 New Features
      labels:
        - enhancement
        - feature
        - feat

    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix

    - title: 📖 Documentation
      labels:
        - documentation
        - docs

    - title: 🔧 Maintenance
      labels:
        - maintenance
        - chore
        - refactor

    - title: ⚡ Performance
      labels:
        - performance
        - perf

    - title: 🔒 Security
      labels:
        - security

    - title: 💥 Breaking Changes
      labels:
        - breaking
        - breaking-change

    - title: 📦 Other Changes
      labels:
        - "*"
