name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请填写以下信息帮助我们定位问题。
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Bug Description
      description: 简要描述遇到的问题
      placeholder: 描述你遇到的 bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 如何复现这个问题？
      placeholder: |
        1. 执行命令 '...'
        2. 选择 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
      description: 你期望的正确行为是什么？
      placeholder: 应该发生什么...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生了什么？
      placeholder: 实际发生了什么...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 程序版本 / Version
      description: 运行 `qobuz-dl-go --version` 获取
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出 / Log Output
      description: 粘贴相关的错误日志或输出
      render: shell
      placeholder: |
        粘贴日志输出...

  - type: textarea
    id: additional
    attributes:
      label: 其他信息 / Additional Context
      description: 任何其他有助于理解问题的信息
